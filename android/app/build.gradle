plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.untitled3'
    compileSdkVersion flutter.compileSdkVersion

    defaultConfig {
        applicationId "com.example.untitled3"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        release {
            storeFile file("my-release-key.jks") // juste le nom
            storePassword "josemario"
            keyAlias "my-key-alias"
            keyPassword "josemario"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    // ✅ Harmonisation Java/Kotlin
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.annotation:annotation:1.7.0'
    }
}

